name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: configure
      run: ./scripts/feeds update -a

    - name: Install dependencies
      run: ./scripts/feeds install -a

    - name: Run make
      run: make
